name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev,notebooks,rl]'
      - run: ruff check examples tests scripts
      - run: pytest
      - run: python scripts/audit_notebooks.py --check
